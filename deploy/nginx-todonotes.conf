# Site do todo-notes no nginx. Instalado em /etc/nginx/sites-available/todonotes pelo
# deploy/preparar-servidor.sh, SÓ SE O ARQUIVO AINDA NÃO EXISTIR: depois do certbot, o de lá
# passa a ter o bloco 443 que o certbot escreveu, e sobrescrevê-lo derrubaria o TLS.
#
# Só o bloco HTTP. O `certbot --nginx -d todo-notes.keystech.dev` converte para TLS e
# acrescenta o redirecionamento de 80 para 443.

server {
    listen 80;
    listen [::]:80;
    server_name todo-notes.keystech.dev;

    # `atual` é um link simbólico para a versão publicada em releases/<commit>/. A troca de
    # versão é a troca do link — atômica, e a volta é apontar para a anterior.
    root /var/www/todonotes/atual;
    index index.html;

    # Cabeçalhos de segurança. Atenção à regra do nginx: um `add_header` dentro de uma
    # `location` DESCARTA todos os do nível de cima. Por isso cada location que define o
    # próprio Cache-Control repete os três.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Os arquivos do build do Angular têm o hash do conteúdo no nome (main-AB12CD34.js): um
    # nome, um conteúdo, para sempre. Podem ficar em cache um ano.
    location ~ "^/[a-z0-9-]+-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    # As rotas são do Angular Router. Sem o fallback, recarregar /preferencias devolve 404:
    # o arquivo não existe no disco, quem resolve o caminho é o JavaScript. O index.html
    # nunca fica em cache — é ele que aponta para os arquivos da versão nova.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }

    # Todos os controllers ficam sob /api. Sem barra final no proxy_pass, para o prefixo ser
    # preservado: /api/tarefas chega como /api/tarefas. A porta é a SERVER_PORT do
    # /etc/todonotes/todonotes.env.
    location /api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SOBRESCREVE o que o cliente mandou. Nunca $proxy_add_x_forwarded_for: ele
        # ACRESCENTA o endereço real ao valor do cliente, o Spring toma a primeira entrada,
        # e o atacante escolheria o próprio balde do limite de login a cada tentativa.
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    # Sem `location` para /actuator, de propósito: o health vive na MANAGEMENT_PORT, em
    # 127.0.0.1, fora do proxy.
}

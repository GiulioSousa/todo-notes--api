server:
  # Botão declarado, e não só precedência de variável: no servidor a 8080 é de outra
  # aplicação, e quem ler este arquivo não pode achar que a porta é fixa.
  port: ${SERVER_PORT:8080}
  # Em produção o backend fica atrás do nginx e não deve ser alcançável direto: com o
  # endereço em loopback, o proxy é a única porta de entrada. Isso não é conforto — é a
  # condição que torna `forward-headers-strategy` seguro logo abaixo. Vazio em
  # desenvolvimento, para escutar em todas as interfaces.
  address: ${SERVER_ADDRESS:}
  # O limite de login por origem usa `getRemoteAddr()`. Atrás de um proxy, esse método
  # devolve o endereço do próprio proxy para toda requisição, e os baldes de todos os
  # clientes colapsam num só: o primeiro que errasse cinco senhas trancaria o login de
  # todo mundo — a proteção viraria negação de serviço.
  #
  # Com FRAMEWORK, o contêiner resolve o endereço real a partir de `X-Forwarded-For` antes
  # de a requisição chegar ao filtro. Só é seguro com as duas condições juntas: o nginx
  # SOBRESCREVE o cabeçalho (`$remote_addr`, nunca `$proxy_add_x_forwarded_for`), e o
  # `address` acima impede falar com a aplicação sem passar por ele. Sem elas, o cliente
  # forjaria o próprio endereço e escaparia do limite. O padrão continua NONE.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}

spring:
  application:
    name: todonotes-backend
  profiles:
    # Sem perfil explícito, carrega application-local.yml, que o Git ignora.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/todonotes_db}
    # Role de execução: só DML nas quatro tabelas, sem DDL e sem acesso ao histórico do
    # Flyway. Quem cria e altera o schema é a role de migração abaixo.
    username: ${DB_USERNAME:todonotes_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # O schema é do Flyway. `validate` recusa subir se a entidade e a tabela divergirem,
      # que é a única forma de descobrir isso antes de uma consulta falhar em produção.
      ddl-auto: validate
    open-in-view: false
    # Ligar os dois juntos é o caminho para ver os UPDATE da renumeração da faixa quando
    # um card é arrastado — é o que mais vale olhar neste projeto.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Credencial própria, com DDL, usada só durante a subida. O Spring Boot deriva a
    # conexão do datasource acima e troca apenas usuário e senha.
    #
    # Esta role tem de ser a mesma do criar-roles.sql: os privilégios padrão de lá valem
    # para objetos criados por ela. Se o Flyway conectar como outra, as tabelas nascem
    # invisíveis para todonotes_app e a aplicação sobe sem enxergar nada.
    user: ${DB_MIGRACAO_USERNAME:todonotes_migracao}
    password: ${DB_MIGRACAO_PASSWORD}

logging:
  file:
    # Em console, a trilha some junto com a janela — e "quem tentou entrar na semana
    # passada" é exatamente a pergunta que ela existe para responder. Rotação e retenção
    # ficam nos padrões do Spring Boot: 10MB por arquivo, 7 de histórico.
    name: logs/backend.log
  level:
    com.todonotes.backend: INFO
    # Nível próprio, de propósito: calar a depuração da aplicação não pode, junto, apagar
    # o registro de quem entrou.
    AUDITORIA: INFO

todonotes:
  cors:
    # Origens autorizadas a chamar a API de outro domínio. O padrão é o `ng serve`.
    # Servindo frontend e API sob o mesmo domínio, requisição de mesma origem não passa
    # por CORS e a lista pode ficar vazia: `CORS_ORIGENS=` desliga o acesso entre origens.
    origens: ${CORS_ORIGENS:http://localhost:4200}
  jwt:
    # Sem padrão, de propósito: a aplicação não sobe sem segredo definido. Em
    # desenvolvimento ele vem do application-local.yml; em produção, da variável.
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:1440}
  limite-requisicoes:
    # Protege o login contra forca bruta, por endereco de origem.
    login:
      tentativas: 5
      janela: 1m
    # Por conta alvo: o limite por origem acima nao alcanca ataque distribuido, em que
    # cada origem chega com o balde intacto. Zera a cada login bem-sucedido.
    login-por-conta:
      tentativas: 10
      janela: 15m

management:
  server:
    # Porta e endereço próprios, separados da API e ligados ao loopback: o health check
    # existe para quem opera a máquina, não para a internet. Na porta da API ele ficaria
    # exposto pelo proxy, e a alternativa — exigir autenticação — quebraria o único uso
    # que ele tem, que é responder antes de haver sessão.
    port: ${MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # Só health. O padrão do Actuator já é restritivo, mas declarar o conjunto evita
        # que uma atualização do framework passe a expor algo novo sem ninguém decidir.
        include: health
  endpoint:
    health:
      # Sem detalhes: o corpo diz UP ou DOWN e nada sobre banco, disco ou versão. Mesmo
      # numa porta fechada, detalhe de infraestrutura em resposta é mapa do sistema.
      show-details: never
      show-components: never
